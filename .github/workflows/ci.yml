name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

env:
    PHP_VERSION: "8.5"
    PHP_EXTENSIONS: apcu, gd, intl, mbstring, opcache, pdo_pgsql, redis, zip

jobs:
    qa:
        name: ${{ matrix.name }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    # Check-only commands: they report violations and fail the build
                    # instead of auto-fixing (unlike the composer qa:* fix scripts).
                    - name: rector
                      run: vendor/bin/rector --dry-run
                    - name: cs-fixer
                      run: vendor/bin/php-cs-fixer fix --allow-risky=yes --dry-run --diff
                    - name: twig
                      run: vendor/bin/twig-cs-fixer lint templates
                    - name: phpstan
                      run: vendor/bin/phpstan --memory-limit=1G
        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ env.PHP_VERSION }}
                  extensions: ${{ env.PHP_EXTENSIONS }}
                  coverage: none
                  tools: composer:v2

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer dependencies
              uses: actions/cache@v4
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: composer-${{ hashFiles('composer.lock') }}
                  restore-keys: composer-

            - name: Install dependencies
              run: composer install --no-interaction --prefer-dist --optimize-autoloader

            - name: Run ${{ matrix.name }}
              run: ${{ matrix.run }}

    phpunit:
        name: phpunit
        runs-on: ubuntu-latest
        services:
            database:
                image: postgres:18
                env:
                    POSTGRES_DB: test
                    POSTGRES_USER: test
                    POSTGRES_PASSWORD: test
                ports:
                    - "5432:5432"
                options: >-
                    --health-cmd="pg_isready -U test -d test"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5
        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ env.PHP_VERSION }}
                  extensions: ${{ env.PHP_EXTENSIONS }}
                  coverage: pcov
                  tools: composer:v2

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer dependencies
              uses: actions/cache@v4
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: composer-${{ hashFiles('composer.lock') }}
                  restore-keys: composer-

            - name: Install dependencies
              run: composer install --no-interaction --prefer-dist --optimize-autoloader

            - name: Configure test database
              run: echo 'DATABASE_URL=postgresql://test:test@127.0.0.1:5432/test?serverVersion=18&charset=utf8' >> .env.test

            - name: Run PHPUnit
              run: composer qa:phpunit
