stages:
    - build
    - qa
    - test

variables:
    COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer-cache"

cache:
    key:
        files:
            - composer.lock
    paths:
        - .composer-cache/
        - vendor/

image:
    name: $CI_REGISTRY_IMAGE/php:latest
    pull_policy: always

build:
    stage: build
    image: docker:latest
    services:
        - docker:dind
    before_script:
        - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    script:
        - docker build -t $CI_REGISTRY_IMAGE/php:latest -f docker/php/Dockerfile .
        - docker push $CI_REGISTRY_IMAGE/php:latest

.php_base:
    needs:
        - job: build
          optional: true
    before_script:
        - composer install --no-interaction --prefer-dist --optimize-autoloader

cs-fixer:
    extends: .php_base
    stage: qa
    script:
        - composer qa:cs-fix

rector:
    extends: .php_base
    stage: qa
    script:
        - composer qa:rector

phpstan:
    extends: .php_base
    stage: qa
    script:
        - composer qa:phpstan

phpunit:
    extends: .php_base
    stage: test
    services:
        - name: mysql:8.4
          alias: database
    variables:
        MYSQL_ROOT_PASSWORD: root
        MYSQL_DATABASE: acme_test
        MYSQL_USER: acme
        MYSQL_PASSWORD: acme
    script:
        - composer qa:phpunit
    coverage: '/^\s*Lines:\s*\d+.\d+\%/'
    artifacts:
        reports:
            junit: var/log/junit.xml
            coverage_report:
                coverage_format: cobertura
                path: var/log/cobertura.xml
        when: always
        expire_in: 1 week

twig-fixer:
    extends: .php_base
    stage: qa
    script:
        - composer qa:twig-fix
