image: php:8.5-cli

definitions:
  services:
    postgres:
      image: postgres:18
      variables:
        POSTGRES_DB: test
        POSTGRES_USER: test
        POSTGRES_PASSWORD: test

  caches:
    composer: .composer-cache
    vendor: vendor

  steps:
    - step: &cs-fixer
        name: CS Fixer
        caches:
          - composer
          - vendor
        script:
          - &setup |
            set -e
            curl -sSLf https://github.com/mlocati/docker-php-extension-installer/releases/latest/download/install-php-extensions -o /usr/local/bin/install-php-extensions
            chmod +x /usr/local/bin/install-php-extensions
            install-php-extensions gd intl mbstring apcu opcache pdo_pgsql redis zip pcov
            curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
            export COMPOSER_CACHE_DIR="$BITBUCKET_CLONE_DIR/.composer-cache"
            export COMPOSER_ALLOW_SUPERUSER=1
            composer install --no-interaction --prefer-dist --optimize-autoloader
          - composer qa:cs-fix

    - step: &rector
        name: Rector
        caches:
          - composer
          - vendor
        script:
          - *setup
          - composer qa:rector

    - step: &phpstan
        name: PHPStan
        caches:
          - composer
          - vendor
        script:
          - *setup
          - composer qa:phpstan

    - step: &twig-fixer
        name: Twig Fixer
        caches:
          - composer
          - vendor
        script:
          - *setup
          - composer qa:twig-fix

    - step: &phpunit
        name: PHPUnit
        services:
          - postgres
        caches:
          - composer
          - vendor
        script:
          - *setup
          - echo 'DATABASE_URL=postgresql://test:test@127.0.0.1:5432/test?serverVersion=18&charset=utf8' >> .env.test
          - composer qa:phpunit

pipelines:
  default:
    - parallel:
        - step: *cs-fixer
        - step: *rector
        - step: *phpstan
        - step: *twig-fixer
    - step: *phpunit

  pull-requests:
    '**':
      - parallel:
          - step: *cs-fixer
          - step: *rector
          - step: *phpstan
          - step: *twig-fixer
      - step: *phpunit

  branches:
    main:
      - parallel:
          - step: *cs-fixer
          - step: *rector
          - step: *phpstan
          - step: *twig-fixer
      - step: *phpunit
