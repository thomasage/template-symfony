name: acme

services:

    php:
        build:
            context: .
            dockerfile: docker/frankenphp/Dockerfile
            target: ${DOCKER_TARGET:-frankenphp_dev}
        restart: unless-stopped
        ports:
            - "80:80"
            - "443:443"
            - "443:443/udp"
        environment:
            SERVER_NAME: ${SERVER_NAME:-acme.localhost}
            TZ: America/Toronto
        depends_on:
            database:
                condition: service_healthy
        networks:
            - acme-network

    worker:
        build:
            context: .
            dockerfile: docker/frankenphp/Dockerfile
            target: ${DOCKER_TARGET:-frankenphp_dev}
        restart: unless-stopped
        environment:
            TZ: America/Toronto
        depends_on:
            database:
                condition: service_healthy
            redis:
                condition: service_started
        command: php bin/console messenger:consume -vv
        # The messenger consumer does not serve HTTP, so the image's HTTP healthcheck does not apply
        healthcheck:
            disable: true
        networks:
            - acme-network

    database:
        image: mysql:8.4.3
        restart: unless-stopped
        ports:
            - "3306:3306"
        volumes:
            - mysql_data:/var/lib/mysql
            - ./docker/mysql/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: acme
            MYSQL_USER: acme
            MYSQL_PASSWORD: acme
            TZ: America/Toronto
        healthcheck:
            test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}" ]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - acme-network

    redis:
        image: redis
        restart: unless-stopped
        networks:
            - acme-network

volumes:
    mysql_data:
        driver: local

networks:
    acme-network:
        driver: bridge
