name: acme

services:

    php:
        build:
            context: .
            dockerfile: docker/frankenphp/Dockerfile
            target: ${DOCKER_TARGET:-frankenphp_dev}
        restart: unless-stopped
        ports:
            - "80:80"
            - "443:443"
            - "443:443/udp"
        environment:
            SERVER_NAME: ${SERVER_NAME:-acme.localhost}
            TZ: America/Toronto
        depends_on:
            database:
                condition: service_healthy
        networks:
            - acme-network

    worker:
        build:
            context: .
            dockerfile: docker/frankenphp/Dockerfile
            target: ${DOCKER_TARGET:-frankenphp_dev}
        restart: unless-stopped
        environment:
            TZ: America/Toronto
        depends_on:
            database:
                condition: service_healthy
            redis:
                condition: service_started
        command: php bin/console messenger:consume -vv
        # The messenger consumer does not serve HTTP, so the image's HTTP healthcheck does not apply
        healthcheck:
            disable: true
        networks:
            - acme-network

    database:
        image: postgres:18
        restart: unless-stopped
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql
            - ./docker/postgres/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
        environment:
            POSTGRES_DB: acme
            POSTGRES_USER: acme
            POSTGRES_PASSWORD: acme
            TZ: America/Toronto
        healthcheck:
            test: [ "CMD", "pg_isready", "-U", "acme", "-d", "acme" ]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - acme-network

    redis:
        image: redis
        restart: unless-stopped
        networks:
            - acme-network

volumes:
    postgres_data:
        driver: local

networks:
    acme-network:
        driver: bridge
